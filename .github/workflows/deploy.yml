name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  # let a running deploy finish; GitHub keeps only the newest queued run
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # end-to-end on desktop and Pixel 7 (builds and previews the app itself)
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      # PRD quality gate: Lighthouse performance ≥ 95 and accessibility 100
      - run: |
          pnpm preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.3 http://localhost:4173/osvc-v-employee/
          pnpm lighthouse
      # publishes dist/ to the gh-pages branch, which GitHub Pages serves
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
